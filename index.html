<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCFI Nagpur Chapter | Quick Access Portal</title>
    <style>
        :root {
            --qcfi-blue: #1c3d90;
            --qcfi-dark-blue: #0f2252;
            --qcfi-yellow: #ffde59;
            --yt-red: #ff3333;
            --emerald-green: #14b87a;
            --bg-gradient: linear-gradient(135deg, #0b1528 0%, #172a4d 50%, #0d1e38 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.18);
            --text-main: #ffffff;
            --text-sub: #d1dcff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: var(--text-main);
        }

        .main-wrapper {
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Responsive Side-by-Side Grid */
        .portal-grid {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 32px;
        }

        /* Left Side: Flyer Image */
        .left-panel {
            flex: 1 1 45%;
            max-width: 480px;
        }

        .poster-card {
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.25);
            line-height: 0;
        }

        .poster-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Right Side: Action Hub */
        .right-panel {
            flex: 1 1 55%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hub-tagline {
            text-align: left;
            padding-bottom: 4px;
        }

        .hub-tagline h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .hub-tagline p {
            font-size: 0.92rem;
            color: #adc4f7;
            margin-top: 4px;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .action-card {
            display: flex;
            align-items: center;
            text-decoration: none;
            position: relative;
            padding: 16px 20px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
        }

        .action-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }

        .action-card:active {
            transform: scale(0.98);
            filter: brightness(1.15);
        }

        /* Specific Link Color Accents */
        .action-card.card-register {
            border-left: 6px solid var(--qcfi-yellow);
            background: linear-gradient(90deg, rgba(28, 61, 144, 0.75) 0%, rgba(23, 42, 77, 0.85) 100%);
        }

        .action-card.card-youtube {
            border-left: 6px solid var(--yt-red);
            background: linear-gradient(90deg, rgba(140, 15, 15, 0.6) 0%, rgba(35, 15, 20, 0.85) 100%);
        }

        .action-card.card-books {
            border-left: 6px solid var(--emerald-green);
            background: linear-gradient(90deg, rgba(13, 138, 91, 0.6) 0%, rgba(10, 36, 26, 0.85) 100%);
        }

        .action-card.card-contact {
            border-left: 6px solid #4da3ff;
            background: linear-gradient(90deg, rgba(20, 80, 160, 0.5) 0%, rgba(15, 30, 60, 0.75) 100%);
        }

            height: 48px;
            border-radius: 12px;
